<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Voice Chat (Robust)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        .pulse-indigo { animation: pulse-indigo 2s infinite; }
        @keyframes pulse-indigo { 0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } }
        .message-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full flex flex-col gap-6 h-[95vh]">
        <!-- Header -->
        <div class="flex items-center justify-between glass p-4 rounded-2xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">OpenCode Voice</h1>
                    <div class="flex items-center gap-2">
                        <span id="statusIndicator" class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <span id="statusText" class="text-xs text-slate-500 font-medium">Connecting...</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="timer" class="font-mono text-base font-bold text-slate-700">00:00</span>
                <button id="exportBtn" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-6 flex-1 overflow-hidden">
            <!-- Sidebar -->
            <div class="w-full md:w-1/3 flex flex-col gap-6">
                <div class="glass p-6 rounded-3xl shadow-xl flex flex-col items-center gap-6 relative overflow-hidden">
                    <canvas id="visualizer" class="w-full h-24 rounded-xl bg-slate-100/50"></canvas>
                    
                    <div class="flex flex-col items-center gap-4 w-full">
                        <button id="recordBtn" class="group relative flex flex-col items-center justify-center w-24 h-24 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full transition-all duration-300 shadow-lg shadow-indigo-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i id="recordIcon" data-lucide="mic" class="w-10 h-10 mb-1"></i>
                            <span id="recordText" class="text-[10px] font-bold uppercase tracking-wider">Start</span>
                        </button>

                        <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-xl hover:bg-slate-50 transition-colors w-full justify-center">
                            <div class="relative">
                                <input type="checkbox" id="autoMode" class="sr-only peer">
                                <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            </div>
                            <span class="text-xs font-semibold text-slate-600 group-hover:text-indigo-600 transition-colors">Auto-Record</span>
                        </label>
                    </div>
                    
                    <!-- VAD Indicator -->
                    <div id="vadIndicator" class="w-full opacity-0 transition-opacity">
                        <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-tighter">
                            <span>VAD</span>
                            <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                                <div id="vadLevel" class="h-full bg-indigo-400 transition-all duration-75" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main History -->
            <div class="flex-1 glass rounded-3xl shadow-sm overflow-hidden flex flex-col p-6">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Conversation History</h2>
                    <span id="syncStatus" class="text-[10px] font-bold text-emerald-500 uppercase flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Synchronized
                    </span>
                </div>
                <div id="log" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-4">
                    <!-- Messages -->
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let animationId;
        let startTime;
        let timerInterval;
        let vad;
        let socket;

        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const exportBtn = document.getElementById('exportBtn');
        const autoMode = document.getElementById('autoMode');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const timerDiv = document.getElementById('timer');
        const logDiv = document.getElementById('log');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const vadIndicator = document.getElementById('vadIndicator');
        const vadLevel = document.getElementById('vadLevel');

        // WebSocket Setup
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            socket.onopen = () => {
                updateStatus("Ready", "bg-emerald-500");
                loadHistory();
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log("WS Message:", data);

                if (data.type === 'status') {
                    if (data.status === 'thinking') {
                        updateStatus("OpenCode is thinking...", "bg-indigo-500 pulse-indigo");
                    } else if (data.status === 'ready') {
                        updateStatus("Ready", "bg-emerald-500");
                        resetRecordBtn();
                    }
                } else if (data.type === 'new_message') {
                    // Remove any "...Transcribing..." placeholders
                    const placeholders = logDiv.querySelectorAll('.placeholder-msg');
                    placeholders.forEach(p => p.remove());

                    if (data.user_message) {
                        addMessage('You', data.user_message.content, null, null, null, true);
                    }
                    if (data.message) {
                        addMessage('OpenCode', data.message.content, data.message.audio_url, data.message.command, data.message.id, false);
                    }
                }
            };

            socket.onclose = () => {
                updateStatus("Disconnected. Retrying...", "bg-red-500");
                setTimeout(connectWebSocket, 3000);
            };
        }

        connectWebSocket();

        async function loadHistory() {
            try {
                const res = await fetch('/history');
                const data = await res.json();
                logDiv.innerHTML = "";
                data.history.reverse().forEach(msg => {
                    addMessage(msg.role === 'user' ? 'You' : 'OpenCode', msg.content, msg.audio_url, msg.command, msg.id, true);
                });
                
                if (data.is_thinking) {
                    updateStatus("OpenCode is thinking...", "bg-indigo-500 pulse-indigo");
                }
            } catch (err) { console.error("Failed to load history:", err); }
        }

        function addMessage(sender, text, audioUrl, command, msgId, isHistory = false) {
            const div = document.createElement('div');
            const isAgent = sender !== 'You';
            div.className = `flex flex-col ${isAgent ? 'items-start' : 'items-end'} message-fade-in`;
            if (text === '...Transcribing...') div.classList.add('placeholder-msg');
            
            let contentHtml = `
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${sender}</span>
                </div>
                <div class="max-w-[85%] p-4 rounded-2xl shadow-sm ${isAgent ? 'bg-white text-slate-800 rounded-tl-none' : 'bg-indigo-600 text-white rounded-tr-none'}">
                    <p class="text-sm leading-relaxed">${text}</p>
            `;

            if (command) {
                contentHtml += `
                    <div class="mt-4 p-3 bg-slate-900 rounded-xl font-mono text-xs overflow-hidden">
                        <div class="text-slate-500 mb-1">Action Proposal:</div>
                        <div class="text-emerald-400 break-all">$ ${command}</div>
                        <div class="flex gap-2 mt-3">
                            <button onclick="executeCommand(${msgId}, this)" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors font-sans font-bold">Execute</button>
                            <button onclick="this.parentElement.parentElement.remove()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors font-sans">Dismiss</button>
                        </div>
                    </div>
                `;
            }

            if (audioUrl) {
                contentHtml += `
                    <div class="mt-3 pt-3 border-t ${isAgent ? 'border-slate-100' : 'border-indigo-500'}">
                        <audio controls class="h-8 w-full ${isAgent ? '' : 'filter invert'}" src="${audioUrl}" ${!isHistory ? 'autoplay' : ''}></audio>
                    </div>
                `;
            }

            contentHtml += `</div>`;
            div.innerHTML = contentHtml;
            
            // Auto-Record loop
            if (audioUrl && isAgent && !isHistory) {
                const audio = div.querySelector('audio');
                audio.onended = () => {
                    if (autoMode.checked && !recordBtn.disabled) {
                        startRecording();
                    }
                };
            }

            logDiv.prepend(div);
        }

        // --- Recording Logic --- (similar to before but refined)

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                visualize();

                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                 ? 'audio/webm;codecs=opus' 
                                 : 'audio/ogg;codecs=opus';
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    const formData = new FormData();
                    formData.append('file', audioBlob, `recording.webm`);

                    updateStatus("Uploading...", "bg-blue-500");
                    try {
                        const response = await fetch('/upload', { method: 'POST', body: formData });
                        const data = await response.json();
                        // Add placeholder
                        addMessage('You', '...Transcribing...', null, null, null, true);
                    } catch (err) {
                        updateStatus("Upload failed", "bg-red-500");
                        resetRecordBtn();
                    }
                    stream.getTracks().forEach(track => track.stop());
                    if (audioContext) audioContext.close();
                    if (vad && !autoMode.checked) vad.stop();
                };

                mediaRecorder.start();
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                
                recordBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'pulse-red');
                recordBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                recordIcon.setAttribute('data-lucide', 'square');
                recordText.textContent = "Stop";
                lucide.createIcons();
                
                updateStatus("Listening...", "bg-green-500");

                if (autoMode.checked) {
                    vadIndicator.classList.remove('opacity-0');
                    vad = new VoiceActivityDetector(stream, {
                        onSpeechEnd: () => { if (mediaRecorder.state === "recording") stopRecording(); },
                        onLevelUpdate: (level) => { vadLevel.style.width = level + '%'; }
                    });
                }
            } catch (err) {
                updateStatus("Mic access denied", "bg-red-500");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                cancelAnimationFrame(animationId);
                clearInterval(timerInterval);
                recordBtn.disabled = true;
                recordText.textContent = "Waiting";
                vadIndicator.classList.add('opacity-0');
            }
        }

        function resetRecordBtn() {
            recordBtn.disabled = false;
            recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700', 'pulse-red');
            recordBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            recordIcon.setAttribute('data-lucide', 'mic');
            recordText.textContent = "Start";
            lucide.createIcons();
        }

        function updateStatus(text, colorClass) {
            statusText.textContent = text;
            statusIndicator.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        function updateTimer() {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(diff / 60).toString().padStart(2, '0');
            const secs = (diff % 60).toString().padStart(2, '0');
            timerDiv.textContent = `${mins}:${secs}`;
        }

        function visualize() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const draw = () => {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    barHeight = (dataArray[i] / 255) * canvas.height;
                    canvasCtx.fillStyle = '#6366f1';
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            };
            draw();
        }

        class VoiceActivityDetector {
            constructor(stream, options = {}) {
                this.stream = stream;
                this.threshold = options.threshold || -45;
                this.silenceDelay = options.silenceDelay || 1500;
                this.speechDelay = options.speechDelay || 150;
                this.onSpeechEnd = options.onSpeechEnd || (() => {});
                this.onLevelUpdate = options.onLevelUpdate || (() => {});
                this.isSpeaking = false;
                this.lastSilenceTime = 0;
                this.running = true;
                this.init();
            }
            async init() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.source = this.audioContext.createMediaStreamSource(this.stream);
                this.analyser = this.audioContext.createAnalyser();
                this.source.connect(this.analyser);
                this.dataArray = new Float32Array(this.analyser.fftSize);
                this.loop();
            }
            loop() {
                if (!this.running) return;
                this.analyser.getFloatTimeDomainData(this.dataArray);
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) sum += this.dataArray[i] * this.dataArray[i];
                const rms = Math.sqrt(sum / this.dataArray.length);
                const db = 20 * Math.log10(rms || 1e-10);
                this.onLevelUpdate(Math.max(0, Math.min(100, (db + 80) * 1.5)));
                const now = Date.now();
                if (db > this.threshold) {
                    this.isSpeaking = true;
                    this.lastSilenceTime = 0;
                } else if (this.isSpeaking) {
                    if (this.lastSilenceTime === 0) this.lastSilenceTime = now;
                    if (now - this.lastSilenceTime > this.silenceDelay) {
                        this.isSpeaking = false;
                        this.onSpeechEnd();
                    }
                }
                requestAnimationFrame(() => this.loop());
            }
            stop() { this.running = false; if (this.audioContext) this.audioContext.close(); }
        }

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") stopRecording();
            else startRecording();
        });

        async function executeCommand(msgId, btn) {
            try {
                btn.disabled = true;
                btn.textContent = "Executing...";
                const res = await fetch(`/execute/${msgId}`, { method: 'POST' });
                if (res.ok) {
                    btn.textContent = "Success";
                    btn.classList.replace('bg-emerald-600', 'bg-slate-700');
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = "Error";
            }
        }
    </script>
</body>
</html>
