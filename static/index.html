<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Voice Chat</title>
    <link rel="stylesheet" id="themeStylesheet" href="/static/dist.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full flex flex-col gap-6 h-[95vh] theme-container">
        <!-- Header -->
        <div class="flex items-center justify-between glass p-4 rounded-2xl shadow-sm header-skin">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">OpenCode Voice <span class="text-[10px] font-medium text-slate-400 ml-1">v0.0.6</span></h1>
                    <div class="flex items-center gap-2">
                        <span id="statusIndicator" class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <span id="statusText" class="text-xs text-slate-500 font-medium">Ready</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="themeToggle" onclick="toggleTheme()" class="text-[10px] font-bold text-slate-400 hover:text-indigo-600 cursor-pointer uppercase tracking-widest border border-slate-200 px-2 py-0.5 rounded-full transition-colors mr-2">Default Skin</span>
                <span id="timer" class="font-mono text-base font-bold text-slate-700">00:00</span>
                <button id="exportBtn" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-6 flex-1 overflow-hidden">
            <!-- Sidebar: Controls & Visualizer (1/3) -->
            <div class="w-full md:w-1/3 flex flex-col gap-6">
                <div class="glass p-6 rounded-3xl shadow-xl flex flex-col items-center gap-6 relative overflow-hidden sidebar-skin">
                    <canvas id="visualizer" class="w-full h-24 rounded-xl bg-slate-100/50"></canvas>
                    
                    <div class="flex flex-col items-center gap-4 w-full">
                        <button id="recordBtn" class="group relative flex flex-col items-center justify-center w-24 h-24 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full transition-all duration-300 shadow-lg shadow-indigo-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i id="recordIcon" data-lucide="mic" class="w-10 h-10 mb-1"></i>
                            <span id="recordText" class="text-[10px] font-bold uppercase tracking-wider">Start</span>
                        </button>

                        <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-xl hover:bg-slate-50 transition-colors w-full justify-center">
                            <div class="relative">
                                <input type="checkbox" id="autoMode" class="sr-only peer">
                                <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            </div>
                            <span class="text-xs font-semibold text-slate-600 group-hover:text-indigo-600 transition-colors">Auto-Record</span>
                        </label>
                    </div>
                    
                    <!-- VAD Sensitivity Display -->
                    <div id="vadIndicator" class="w-full opacity-0 transition-opacity">
                        <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-tighter">
                            <span>VAD</span>
                            <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                                <div id="vadLevel" class="h-full bg-indigo-400 transition-all duration-75" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main: Chat History (2/3) -->
            <div class="flex-1 glass rounded-3xl shadow-sm overflow-hidden flex flex-col p-6 history-skin">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-2">Conversation History</h2>
                <div id="log" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-4">
                    <!-- Messages injected here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between px-6 py-3 glass rounded-2xl shadow-sm footer-skin">
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                Local-First AI Voice Bridge
            </div>
            <div class="text-[10px] font-medium text-slate-400">
                Architecture v0.0.6 • Optimized for LAN
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let animationId;
        let startTime;
        let timerInterval;
        let vad;

        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const exportBtn = document.getElementById('exportBtn');
        const autoMode = document.getElementById('autoMode');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const timerDiv = document.getElementById('timer');
        const logDiv = document.getElementById('log');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const vadIndicator = document.getElementById('vadIndicator');
        const vadLevel = document.getElementById('vadLevel');

        // Theme Management
        function toggleTheme() {
            const link = document.getElementById('themeStylesheet');
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            
            if (link.href.includes('dist.css')) {
                link.href = '/static/themes/falstar/falstar.css';
                toggle.textContent = 'Falstar Skin';
                toggle.classList.replace('text-slate-400', 'text-orange-500');
                body.classList.add('falstar-theme');
            } else {
                link.href = '/static/dist.css';
                toggle.textContent = 'Default Skin';
                toggle.classList.replace('text-orange-500', 'text-slate-400');
                body.classList.remove('falstar-theme');
            }
        }

        // WebSocket Setup
        let socket;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            socket.onopen = () => {
                console.log("WebSocket connected");
                updateStatus("Connected", "bg-green-500");
            };

            socket.onmessage = (event) => {
                console.log("[WS] Received:", event.data);
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    if (data.status === 'thinking') {
                        updateStatus("OpenCode is thinking...", "bg-indigo-500");
                        showThinkingBubble();
                    } else if (data.status === 'ready') {
                        updateStatus("Ready", "bg-slate-300");
                        removeThinkingBubble();
                        resetRecordBtn();
                    }
                } else if (data.type === 'new_message') {
                    removeThinkingBubble();
                    loadHistory(true);
                }
            };

            socket.onclose = () => {
                console.log("WebSocket disconnected. Retrying...");
                setTimeout(connectWebSocket, 2000);
            };
        }

        connectWebSocket();

        function showThinkingBubble() {
            if (document.getElementById('thinking-bubble')) return;
            const div = document.createElement('div');
            div.id = 'thinking-bubble';
            div.className = "flex flex-col items-start message-fade-in";
            div.innerHTML = `
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">OpenCode</span>
                </div>
                <div class="max-w-[85%] p-4 rounded-2xl shadow-sm bg-white text-slate-800 rounded-tl-none flex items-center gap-2">
                    <span class="flex gap-1">
                        <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce"></span>
                        <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </span>
                    <span class="text-sm text-slate-500 italic">Thinking...</span>
                    <button onclick="abortTask()" class="ml-4 text-[10px] font-bold text-red-500 hover:text-red-700 uppercase tracking-widest border border-red-200 px-2 py-1 rounded-lg transition-colors">Abort</button>
                </div>
            `;
            logDiv.prepend(div);
        }

        function removeThinkingBubble() {
            const bubble = document.getElementById('thinking-bubble');
            if (bubble) bubble.remove();
        }

        async function abortTask() {
            try {
                await fetch('/abort', { method: 'POST' });
                updateStatus("Ready", "bg-slate-300");
                removeThinkingBubble();
                resetRecordBtn();
            } catch (err) {
                console.error("Failed to abort:", err);
            }
        }

        // Voice Activity Detector Class
        class VoiceActivityDetector {
            constructor(stream, options = {}) {
                this.stream = stream;
                this.threshold = options.threshold || -45; // dB
                this.silenceDelay = options.silenceDelay || 2000; // v0.0.6: Increased for smoother flow
                this.speechDelay = options.speechDelay || 100; // v0.0.6: Faster triggering
                
                this.isSpeaking = false;
                this.noiseFloor = -60; // Initial noise floor estimate
                this.speechStartTimestamp = 0; // v0.0.6: Track duration
                this.onSpeechStart = options.onSpeechStart || (() => {});
                this.onSpeechEnd = options.onSpeechEnd || (() => {});
                this.onLevelUpdate = options.onLevelUpdate || (() => {});
                
                this.lastSpeechTime = 0;
                this.lastSilenceTime = 0;
                this.running = true;

                this.init();
            }

            async init() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.source = this.audioContext.createMediaStreamSource(this.stream);
                
                // Add Bandpass Filter (Voice Range: 300Hz - 3400Hz)
                this.filter = this.audioContext.createBiquadFilter();
                this.filter.type = 'bandpass';
                this.filter.frequency.value = 1850; // Center frequency
                this.filter.Q.value = 0.5; // Wider bandwidth
                
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 2048;
                
                // Connect: Source -> Filter -> Analyser
                this.source.connect(this.filter);
                this.filter.connect(this.analyser);
                
                this.dataArray = new Float32Array(this.analyser.fftSize);
                this.loop();
            }

            getVolume() {
                this.analyser.getFloatTimeDomainData(this.dataArray);
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i] * this.dataArray[i];
                }
                const rms = Math.sqrt(sum / this.dataArray.length);
                const db = 20 * Math.log10(rms || 1e-10);
                return db;
            }

            loop() {
                if (!this.running) return;
                
                const db = this.getVolume();
                const now = Date.now();
                
                // Slowly track noise floor when not speaking
                if (!this.isSpeaking && db < this.noiseFloor + 10) {
                    this.noiseFloor = this.noiseFloor * 0.995 + db * 0.005;
                }

                // Adaptive threshold: noiseFloor + some margin (default 15dB)
                const adaptiveThreshold = Math.max(this.threshold, this.noiseFloor + 12);

                const normalizedLevel = Math.max(0, Math.min(100, (db + 80) * 1.5));
                this.onLevelUpdate(normalizedLevel);

                if (db > adaptiveThreshold) {
                    if (!this.isSpeaking) {
                        if (this.lastSpeechTime === 0) this.lastSpeechTime = now;
                        if (now - this.lastSpeechTime > this.speechDelay) {
                            this.isSpeaking = true;
                            this.speechStartTimestamp = now;
                            this.onSpeechStart();
                        }
                    }
                    this.lastSilenceTime = 0;
                } else {
                    if (this.isSpeaking) {
                        if (this.lastSilenceTime === 0) this.lastSilenceTime = now;
                        
                        // Minimum speech duration of 300ms to filter out pops
                        const duration = now - this.speechStartTimestamp;
                        const isShortPop = duration < 300;
                        
                        if (now - this.lastSilenceTime > (isShortPop ? 100 : this.silenceDelay)) {
                            this.isSpeaking = false;
                            this.onSpeechEnd(isShortPop); // v0.0.6: Pass if it was just a pop
                        }
                    }
                    this.lastSpeechTime = 0;
                }
                requestAnimationFrame(() => this.loop());
            }

            stop() {
                this.running = false;
                if (this.audioContext) this.audioContext.close();
            }
        }

        async function loadHistory(playLast = false) {
            try {
                const res = await fetch('/history');
                const data = await res.json();
                const history = data.history || [];
                
                logDiv.innerHTML = "";
                // v0.0.4: Removed .reverse() to keep chronological order (newest at bottom)
                history.forEach((msg, index) => {
                    const isLast = index === history.length - 1;
                    const shouldPlay = playLast && isLast && msg.role === 'agent';
                    addMessage(msg.role === 'user' ? 'You' : 'OpenCode', msg.content, msg.audio_url, msg.command, msg.id, !shouldPlay);
                });
                
                if (data.is_thinking) showThinkingBubble();
                
                // v0.0.4: Auto-scroll to bottom
                setTimeout(() => {
                    logDiv.scrollTop = logDiv.scrollHeight;
                }, 100);
            } catch (err) { console.error("Failed to load history:", err); }
        }


        loadHistory();

        async function exportHistory() {
            try {
                const res = await fetch('/history');
                const data = await res.json();
                const history = data.history || [];
                let text = "OpenCode Voice Chat Export\n==========================\n\n";
                history.forEach(msg => {
                    const time = new Date(msg.timestamp * 1000).toLocaleString();
                    text += `[${time}] ${msg.role.toUpperCase()}:\n${msg.content}\n\n`;
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `voice_chat_export.txt`;
                a.click();
            } catch (err) { alert("Export failed: " + err); }
        }

        exportBtn.addEventListener('click', exportHistory);

        function updateTimer() {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(diff / 60).toString().padStart(2, '0');
            const secs = (diff % 60).toString().padStart(2, '0');
            timerDiv.textContent = `${mins}:${secs}`;
        }

        function visualize() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            const draw = () => {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    barHeight = (dataArray[i] / 255) * canvas.height;
                    const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                    gradient.addColorStop(0, '#6366f1');
                    gradient.addColorStop(1, '#a5b4fc');
                    canvasCtx.fillStyle = gradient;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            };
            draw();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                visualize();

                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                                 ? 'audio/webm;codecs=opus' 
                                 : 'audio/ogg;codecs=opus';
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    const formData = new FormData();
                    const extension = mimeType.includes('webm') ? 'webm' : 'ogg';
                    formData.append('file', audioBlob, `recording.${extension}`);

                    updateStatus("Uploading...", "bg-blue-500");
                    try {
                        const response = await fetch('/upload', { method: 'POST', body: formData });
                        const data = await response.json();
                        addMessage('You', '...Transcribing...', null, null, data.task_id, true);
                        pollStatus(data.task_id);
                    } catch (err) {
                        updateStatus("Upload failed", "bg-red-500");
                        resetRecordBtn();
                    }
                    stream.getTracks().forEach(track => track.stop());
                    if (audioContext) audioContext.close();
                    if (vad && !autoMode.checked) vad.stop();
                };

                mediaRecorder.start();
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                
                recordBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'pulse-red');
                recordBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                recordIcon.setAttribute('data-lucide', 'square');
                recordText.textContent = "Stop";
                lucide.createIcons();
                updateStatus("Listening...", "bg-green-500");

                if (autoMode.checked) {
                    vadIndicator.classList.remove('opacity-0');
                    vad = new VoiceActivityDetector(stream, {
                        onSpeechEnd: (isShortPop) => {
                            if (mediaRecorder.state === "recording") {
                                if (isShortPop) {
                                    console.log("VAD: Filtered short pop.");
                                    audioChunks = []; // Clear buffer
                                } else {
                                    stopRecording();
                                }
                            }
                        },
                        onLevelUpdate: (level) => {
                            vadLevel.style.width = level + '%';
                            if (vad.isSpeaking) {
                                vadLevel.classList.add('bg-emerald-400');
                                vadLevel.classList.remove('bg-indigo-400');
                            } else {
                                vadLevel.classList.add('bg-indigo-400');
                                vadLevel.classList.remove('bg-emerald-400');
                            }
                        }
                    });
                }
            } catch (err) { updateStatus("Mic access denied", "bg-red-500"); }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                cancelAnimationFrame(animationId);
                clearInterval(timerInterval);
                recordBtn.disabled = true;
                recordText.textContent = "Wait";
                vadIndicator.classList.add('opacity-0');
            }
        }

        function resetRecordBtn() {
            recordBtn.disabled = false;
            recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700', 'pulse-red');
            recordBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            recordIcon.setAttribute('data-lucide', 'mic');
            recordText.textContent = "Start";
            lucide.createIcons();
        }

        function updateStatus(text, colorClass) {
            statusText.textContent = text;
            statusIndicator.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") stopRecording();
            else startRecording();
        });

        async function pollStatus(taskId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/status/${taskId}`);
                    const data = await res.json();
                    if (data.status === 'completed') clearInterval(interval);
                } catch (err) { clearInterval(interval); }
            }, 2000);
        }

        function addMessage(sender, text, audioUrl, command, msgId, isHistory = false) {
            const div = document.createElement('div');
            const isAgent = sender !== 'You';
            div.className = `flex flex-col ${isAgent ? 'items-start' : 'items-end'} message-fade-in mb-4`;
            
            // v0.0.4: Check and replace transcribing placeholders
            if (!isHistory) {
                const placeholders = Array.from(logDiv.querySelectorAll('p')).filter(p => p.textContent === '...Transcribing...');
                if (placeholders.length > 0) {
                    placeholders[0].closest('.message-fade-in').remove();
                }
            }

            let contentHtml = `
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${sender}</span>
                </div>
                <div class="max-w-[85%] p-4 rounded-2xl shadow-sm ${isAgent ? 'bg-white text-slate-800 rounded-tl-none message-agent' : 'bg-indigo-600 text-white rounded-tr-none message-user'}">
                    <p class="text-sm leading-relaxed">${text}</p>
            `;


            if (command) {
                contentHtml += `
                    <div class="mt-4 p-3 bg-slate-900 rounded-xl font-mono text-xs overflow-hidden">
                        <div class="text-slate-500 mb-1">Action Proposal:</div>
                        <div class="text-emerald-400 break-all">$ ${command}</div>
                        <div class="flex gap-2 mt-3">
                            <button onclick="executeCommand(${msgId}, this)" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors font-sans font-bold">Execute</button>
                            <button onclick="this.parentElement.parentElement.remove()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors font-sans">Dismiss</button>
                        </div>
                    </div>
                `;
            }

            if (audioUrl) {
                contentHtml += `
                    <div class="mt-3 pt-3 border-t ${isAgent ? 'border-slate-100' : 'border-indigo-500'}">
                        <audio controls class="h-8 w-full ${isAgent ? '' : 'filter invert'}" src="${audioUrl}"></audio>
                    </div>
                `;
            }

            contentHtml += `</div>`;
            div.innerHTML = contentHtml;
            
            const audio = div.querySelector('audio');
            if (audio && !isHistory) {
                // v0.0.4: Explicit play trigger for mobile/chrome detachment
                setTimeout(() => {
                    audio.play().catch(e => console.log("Autoplay blocked:", e));
                }, 100);

                if (isAgent) {
                    audio.onended = () => {
                        if (autoMode.checked && !recordBtn.disabled) {
                            startRecording();
                        }
                    };
                }
            }

            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function executeCommand(msgId, btn) {
            try {
                btn.disabled = true;
                btn.textContent = "Executing...";
                const res = await fetch(`/execute/${msgId}`, { method: 'POST' });
                if (res.ok) {
                    btn.textContent = "Success";
                    btn.classList.replace('bg-emerald-600', 'bg-slate-700');
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = "Error";
            }
        }
    </script>
</body>
</html>
