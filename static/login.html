<!DOCTYPE html>
<html>
<head>
    <title>Login - OpenCode Voice</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h1 { margin-bottom: 20px; font-size: 1.5em; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1em; text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1em; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>OpenCode Voice</h1>
        <form action="/login" method="post">
            <input type="password" name="passcode" placeholder="Enter Passcode" autofocus required>
            <button type="submit">Unlock</button>
        </form>
        <div id="error" class="error"></div>
    </div>
    <script>
        if (window.location.search.includes('error=1')) {
            document.getElementById('error').textContent = 'Invalid passcode. Try again.';
        }
    </script>
</body>
</html>
